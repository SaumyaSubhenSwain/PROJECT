<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>XPath Practice Playground</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        input {
            margin: 5px;
            padding: 5px;
        }

        button {
            margin-left: 5px;
            padding: 5px 10px;
        }

        h1, h2 {
            margin-top: 20px;
        }

        ul {
            margin-top: 10px;
        }

        table {
            border-collapse: collapse;
            margin-top: 10px;
        }

        table, th, td {
            border: 1px solid black;
            padding: 8px;
        }

        a {
            margin-left: 10px;
        }
    </style>
</head>
<body>

    <h1>XPath Practice Playground</h1>

    <!-- ================= LOGIN SECTION ================= -->
    <section id="login-section">
        <h2>User Login</h2>

        <label>Username</label>
        <input type="text" name="username" placeholder="Enter Username">

        <label>Password</label>
        <input type="password" name="password" placeholder="Enter Password">

        <button id="loginBtn">Login</button>
        <button>Login with OTP</button>

        <p>Welcome to XPath Practice Page</p>
        <p> Hello User </p>
    </section>

    <!-- ================= PROFILE SECTION ================= -->
    <section id="profile">
        <h2>User Profile</h2>

        <input type="text" value="test@example.com">
        <input type="text" value="9999999999">

        <a href="#">Edit Profile</a>
        <a href="#">Logout</a>
    </section>

    <!-- ================= ORDER LIST ================= -->
    <section id="orders">
        <h2>Order List</h2>

        <ul>
            <li>Order 1001</li>
            <li>Order 1002</li>
            <li>Order 1003</li>
            <li>Order 1004</li>
            <li>Order 1005</li>
        </ul>
    </section>

    <!-- ================= USER TABLE ================= -->
    <section id="users">
        <h2>User Table</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>City</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Saumya</td>
                    <td>Bhubaneswar</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Subhen</td>
                    <td>Puri</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Swain</td>
                    <td>Cuttack</td>
                </tr>
            </tbody>
        </table>
    </section>

</body>
</html>
