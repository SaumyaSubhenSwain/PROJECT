<!DOCTYPE html>
<html>
<head>
    <title>Playwright Locator Practice Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h1 {
            font-size: 32px;
        }

        input {
            margin: 5px 0 15px 0;
            padding: 5px;
        }

        button {
            margin-right: 10px;
            padding: 5px 10px;
            cursor: pointer;
        }

        a {
            display: block;
            margin: 15px 0;
        }

        .section {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>Playwright Locator Practice Page</h1>

    <!-- Buttons -->
    <button id="submit-btn" data-testid="submit-btn">Submit</button>
    <button id="cancel-btn" data-testid="cancel-btn">Cancel</button>

    <div class="section">
        <!-- Username -->
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter Username">
    </div>

    <div class="section">
        <!-- Password -->
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter Password">
    </div>

    <!-- Email & Search -->
    <div class="section">
        <input type="email" placeholder="Enter your email" data-testid="email-input">
        <input type="text" placeholder="Search here" data-testid="search-input">
    </div>

    <!-- Login -->
    <div class="section">
        <button id="login-btn" data-testid="login-btn">Login</button>
    </div>

    <!-- Text Section -->
    <div class="section">
        <p>Welcome to Playwright automation practice</p>
        <a href="https://playwright.dev" target="_blank">
            Click here to learn Playwright
        </a>
    </div>

    <!-- Checkbox -->
    <div class="section">
        <input type="checkbox" id="terms" name="terms">
        <label for="terms">Accept Terms and Conditions</label>
    </div>

</body>
</html>
